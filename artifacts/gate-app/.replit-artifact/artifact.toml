kind = "web"
previewPath = "/"
title = "Automatic Gate & Entryways"
version = "1.0.0"
id = "artifacts/gate-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20300

[services.development]
run = "pnpm --filter @workspace/gate-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gate-app", "run", "build" ]
publicDir = "artifacts/gate-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20300"
BASE_PATH = "/"
